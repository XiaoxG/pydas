[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydas"
version = "1.1.0"
authors = [
    {name = "SJTU/SKLOE", email = "xiaoxguo@sjtu.edu.cn"},
]
description = "Python data analysis system, used for processing and analyzing large time series data @ SJTU/SKLOE"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["data analysis", "time series", "signal processing", "ocean engineering", "spectral analysis"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.19.0",
    "pandas>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.3.0",
    "plotly>=5.0.0",
    "numba>=0.50.0",
    "dask>=2021.6.0",
    "dask[dataframe]>=2021.6.0",
    "distributed>=2021.6.0",
    "kaleido>=0.2.0",
    "scikit-learn>=0.24.0",
    "nbformat>=4.2.0",
    "seaborn>=0.12.0",
    "h5py>=3.0.0",
    "openpyxl>=3.0.7",
    "xlsxwriter>=1.4.0",
    "pyarrow>=8.0.0",
]

[project.urls]
"Bug Tracker" = "https://gitee.com/xiaoxianguo/pydas/issues"
"Documentation" = "https://gitee.com/xiaoxianguo/pydas/wikis"
"Source Code" = "https://gitee.com/xiaoxianguo/pydas"

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=21.5b2",
    "flake8>=3.9.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
performance = [
    "datashader>=0.14.0",
    "holoviews>=1.15.0",
    "bokeh>=2.4.0",
    "dask[complete]>=2021.6.0",
    "fastparquet>=0.8.0",
    "pyarrow>=8.0.0",
    "polars>=0.15.0",
    "plotly-resampler>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pydas" = ["*.py"]
"pydas.waveModel" = ["*.py"]
"pydas.plot" = ["*.py"]